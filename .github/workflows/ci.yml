name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # All extras, so the HTTP service and Anthropic client are type-checked
      # against their real dependencies.
      - name: Install package with all extras
        run: python -m pip install -e '.[dev,server,anthropic]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with all extras
        run: python -m pip install -e '.[dev,server,anthropic]'

      # The coverage gate (fail_under = 90) is configured in pyproject.toml.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Resolve the runtime dependency set (all runtime extras) in an isolated
      # virtualenv, then audit exactly those pinned versions. The local package
      # is installed editable and excluded from the export, so it is never
      # looked up on PyPI, and pip-audit's own dependencies are not audited.
      - name: Resolve runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit-env"
          "$RUNNER_TEMP/audit-env/bin/python" -m pip install -e '.[server,anthropic]'
          "$RUNNER_TEMP/audit-env/bin/python" -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-audit.txt"
          cat "$RUNNER_TEMP/requirements-audit.txt"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Fails the job on any known vulnerability in the pinned set.
      - name: Audit dependencies for known vulnerabilities
        run: >-
          pip-audit --strict --progress-spinner off --desc on
          --no-deps --disable-pip
          --requirement "$RUNNER_TEMP/requirements-audit.txt"

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.3

      - name: Validate specs and changes
        run: openspec validate --all --strict

  build:
    name: Build distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      # Installs the bare wheel (no extras) to prove the core library and CLI
      # work without the optional dependencies.
      - name: Smoke test the wheel in a fresh virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/structured-agent" --help
          "$RUNNER_TEMP/smoke/bin/structured-agent" demo

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      IMAGE: structured-output-agent:ci
      CONTAINER: soa-smoke
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the CLI
        run: |
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" demo

      # The default command serves HTTP on 0.0.0.0:8000. No ANTHROPIC_API_KEY
      # is set: probes, model listing and metrics must work without one.
      - name: Start the HTTP service
        run: >-
          docker run --detach --name "$CONTAINER"
          --env SOA_MODELS=structured_output_agent.cli:WeatherReport
          --publish 8000:8000
          "$IMAGE"

      - name: Smoke test the HTTP service
        run: |
          base=http://localhost:8000
          for _ in $(seq 1 30); do
            if curl -fsS "$base/healthz"; then
              echo
              break
            fi
            sleep 1
          done
          curl -fsS "$base/healthz"
          echo
          curl -fsS "$base/readyz"
          echo
          curl -fsS "$base/v1/models" | tee "$RUNNER_TEMP/models.json"
          echo
          grep -q WeatherReport "$RUNNER_TEMP/models.json"
          curl -fsS "$base/metrics" > "$RUNNER_TEMP/metrics.txt"
          head -n 20 "$RUNNER_TEMP/metrics.txt"

      - name: Show service logs
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: Stop the HTTP service
        if: always()
        run: docker rm --force "$CONTAINER" || true

      # Fails on critical OS or library CVEs that have a fix available.
      # Pinned to a commit: this action's tags have been rewritten before.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

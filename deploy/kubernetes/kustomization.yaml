# kubectl apply -k deploy/kubernetes
#
# The Secret is not included: create it out of band (see secret.example.yaml).
# Pin the image for production, e.g. with
#   kustomize edit set image ghcr.io/imranmali/structured-output-agent=ghcr.io/imranmali/structured-output-agent:0.2.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

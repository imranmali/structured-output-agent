# EXAMPLE ONLY - do not commit real credentials. This file is deliberately not
# listed in kustomization.yaml. Create the real secret out of band, e.g.
#
#   kubectl create secret generic structured-output-agent \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=SOA_API_KEYS="$(openssl rand -hex 32)"
#
# or with your secret manager (External Secrets, Sealed Secrets, Vault, ...).
apiVersion: v1
kind: Secret
metadata:
  name: structured-output-agent
  labels:
    app.kubernetes.io/name: structured-output-agent
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Claude API key used by the service to call the model.
  ANTHROPIC_API_KEY: "replace-me-example-anthropic-key"
  # Comma-separated keys clients must present (Authorization: Bearer <key> or
  # X-API-Key). Leave empty only if another layer authenticates callers.
  SOA_API_KEYS: "replace-me-example-client-key-1,replace-me-example-client-key-2"

# Local / single-host deployment of the HTTP service.
#
#   cp deploy/.env.example deploy/.env      # then set ANTHROPIC_API_KEY etc.
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml --profile monitoring up --build   # + Prometheus
#
# deploy/.env is git-ignored. See docs/deployment.md for every SOA_* setting.
name: structured-output-agent

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        EXTRAS: "anthropic,server"
    image: structured-output-agent:local
    env_file:
      - path: .env
        required: false
    environment:
      SOA_MODELS: "${SOA_MODELS:-structured_output_agent.cli:WeatherReport}"
      SOA_LOG_FORMAT: "${SOA_LOG_FORMAT:-json}"
    ports:
      - "8000:8000"
    # Same hardening as the Kubernetes manifests.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # uvicorn drains in-flight requests for up to 30 s after SIGTERM.
    stop_grace_period: 40s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
